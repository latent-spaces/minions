name: Frontend checks
on:
  # Automatic CI is temporarily paused at the owner’s request. Run manually.
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: frontend-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
        working-directory: apps/web
      - name: Install browser for feature permission and recovery regressions
        run: npm --workspace @mlswarm/web exec -- playwright install --with-deps chromium
      - name: Verify team access loss and historical feature-setting retries
        run: |
          node apps/web/test/native-teams-access-loss.mjs
          node apps/web/test/native-feature-settings-recovery.mjs
      - run: npm run build
        working-directory: apps/web
