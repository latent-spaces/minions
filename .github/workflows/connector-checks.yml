name: Connector checks
on:
  # Automatic CI is temporarily paused at the owner’s request. Run manually.
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: connector-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  connector:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install contributor workspaces and build private contracts
        run: npm ci
        working-directory: .
      - name: Build canonical connector bundle
        run: npm --prefix ../../packages/agent-cli run build
      - name: Install namespace init for orphan process reaping
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tini
          /usr/bin/tini --version
      - name: Report native host process-enumeration capability
        run: node --test --test-name-pattern 'native enumeration confirms capability' ../../packages/agent-cli/test/leftover-processes.test.mjs
      - name: Test the complete connector in an isolated Linux process namespace
        # Host daemons can deny /proc environment inspection even to the same uid.
        # Keep real marker enumeration/security checks among all test-owned processes,
        # without granting the tests root or weakening production cleanup guarantees.
        # A real PID 1 must reap orphaned fake workers after the crash scenarios.
        run: |
          runner_uid=$(id -u)
          runner_gid=$(id -g)
          node_binary=$(command -v node)
          npm_cli=$(readlink -f "$(command -v npm)")
          sudo unshare --mount --pid --fork --mount-proc --kill-child=SIGKILL \
            setpriv --reuid="$runner_uid" --regid="$runner_gid" --init-groups --no-new-privs \
            env "PATH=$PATH" "HOME=$HOME" \
            /usr/bin/tini -g -- bash -c '
              "$@"
              result=$?
              if [ "$result" -ne 0 ]; then
                echo "Namespace process states after connector failure (no environments):"
                ps -eo pid,ppid,uid,stat,comm
              fi
              exit "$result"
            ' connector-validation "$node_binary" "$npm_cli" --prefix ../../packages/agent-cli test
      - name: Check backend types used by the tool catalog
        run: npm run typecheck
      # The hosted runner is disposable. Tests use stub models and a demo project;
      # no provider, production Firebase, GitHub-write or npm credentials are supplied.
      # Package publication and cloud deployment remain separate release operations.

  native-tools:
    name: Native connector and tool safety (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify Windows worker containment and portable command resolution
        run: node --test packages/agent-cli/test/windows-command.test.mjs packages/agent-cli/test/windows-supervision.test.mjs
      - run: npm run test:all -- --profile portable --logs native-validation
      # The full suite and release guards retain their Ubuntu jobs: their launchers use POSIX commands.
      - name: Retain native suite logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-validation-${{ matrix.os }}
          path: native-validation/
          if-no-files-found: warn
          retention-days: 7
